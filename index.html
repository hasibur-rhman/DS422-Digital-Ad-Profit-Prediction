<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Profit Simulator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0a0d14',
              surface: '#101422',
              card: '#151b2e',
              border: '#222b44',
              hover: '#293554',
              gold: '#fbbf24',
              sky: '#38bdf8',
              emerald: '#10b981',
              rose: '#f43f5e'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-dark text-slate-200 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-gold selection:text-black">

  <!-- TOP HEADER -->
  <header class="border-b border-brand-border bg-brand-surface/90 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 via-amber-500 to-cyan-500 flex items-center justify-center font-bold text-black font-mono text-base shadow-lg shadow-amber-500/20">
          $
        </div>
        <h1 class="font-bold text-white tracking-tight text-base sm:text-lg">Campaign Profit Simulator</h1>
      </div>
      <button onclick="resetDefaults()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-brand-card hover:bg-brand-hover text-slate-300 border border-brand-border transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Reset
      </button>
    </div>
  </header>

  <!-- MAIN SIMULATOR INTERFACE -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- LEFT COLUMN: CONTROLS & MEDIA PLANNING INPUTS -->
      <div class="lg:col-span-7 bg-brand-card border border-brand-border rounded-2xl p-6 sm:p-7 space-y-6 shadow-xl">
        <h2 class="text-xs font-bold text-slate-400 font-mono uppercase tracking-wider border-b border-brand-border pb-3">
          Campaign Inputs
        </h2>

        <!-- 4-GRID SELECTORS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Platform -->
          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Advertising Platform</label>
            <select id="sim-platform" onchange="calculateProfit()" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold font-sans">
              <option value="LinkedIn" selected>LinkedIn</option>
              <option value="YouTube">YouTube</option>
              <option value="Google Ads">Google Ads</option>
              <option value="Instagram">Meta / Instagram</option>
              <option value="TikTok">TikTok</option>
              <option value="Twitter">Twitter / X</option>
              <option value="Pinterest">Pinterest</option>
            </select>
          </div>

          <!-- Industry Vertical -->
          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Industry Vertical</label>
            <select id="sim-industry" onchange="calculateProfit()" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold font-sans">
              <option value="Finance" selected>Finance &amp; Banking</option>
              <option value="Technology">Technology &amp; SaaS</option>
              <option value="Healthcare">Healthcare &amp; Wellness</option>
              <option value="E-commerce">E-Commerce &amp; Retail</option>
              <option value="Education">Education</option>
              <option value="Automotive">Automotive</option>
            </select>
          </div>

          <!-- Creative Format -->
          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Creative Format</label>
            <select id="sim-creative" onchange="calculateProfit()" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold font-sans">
              <option value="Video" selected>Video Ad</option>
              <option value="Carousel">Carousel</option>
              <option value="Static Image">Static Display Image</option>
              <option value="Text">Text</option>
            </select>
          </div>

          <!-- Target Device -->
          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Primary Target Device</label>
            <select id="sim-device" onchange="calculateProfit()" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold font-sans">
              <option value="Desktop" selected>Desktop</option>
              <option value="Mobile">Mobile</option>
              <option value="Tablet">Tablet</option>
            </select>
          </div>
        </div>

        <!-- SLIDER CONTROLS -->
        <div class="space-y-4 pt-1">
          <!-- Impressions Slider -->
          <div class="bg-brand-dark/50 p-3.5 rounded-xl border border-brand-border">
            <div class="flex justify-between items-center text-xs font-mono mb-2">
              <span class="text-slate-300">Impressions:</span>
              <span id="val-impressions" class="text-brand-sky font-bold text-sm">85,000</span>
            </div>
            <input type="range" id="sim-impressions" min="10000" max="400000" step="5000" value="85000" oninput="calculateProfit()" class="w-full h-1.5 bg-brand-surface rounded-lg appearance-none cursor-pointer accent-brand-sky">
          </div>

          <!-- Campaign Flight Duration Slider -->
          <div class="bg-brand-dark/50 p-3.5 rounded-xl border border-brand-border">
            <div class="flex justify-between items-center text-xs font-mono mb-2">
              <span class="text-slate-300">Flight Duration:</span>
              <span id="val-duration" class="text-brand-gold font-bold text-sm">45 Days</span>
            </div>
            <input type="range" id="sim-duration" min="7" max="90" step="1" value="45" oninput="calculateProfit()" class="w-full h-1.5 bg-brand-surface rounded-lg appearance-none cursor-pointer accent-brand-gold">
          </div>

          <!-- Ad Creative Quality Score Slider -->
          <div class="bg-brand-dark/50 p-3.5 rounded-xl border border-brand-border">
            <div class="flex justify-between items-center text-xs font-mono mb-2">
              <span class="text-slate-300">Quality Score:</span>
              <span id="val-quality" class="text-brand-emerald font-bold text-sm">8.5 / 10</span>
            </div>
            <input type="range" id="sim-quality" min="1" max="10" step="0.5" value="8.5" oninput="calculateProfit()" class="w-full h-1.5 bg-brand-surface rounded-lg appearance-none cursor-pointer accent-brand-emerald">
          </div>
        </div>

        <!-- 3-GRID AUDIENCE & TARGETING -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-1">
          <!-- Retargeting -->
          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Audience Segment</label>
            <select id="sim-retargeting" onchange="calculateProfit()" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold font-sans">
              <option value="true" selected>Retargeting</option>
              <option value="false">Cold Prospecting</option>
            </select>
          </div>

          <!-- Income Bracket -->
          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Income Bracket</label>
            <select id="sim-income" onchange="calculateProfit()" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold font-sans">
              <option value="high" selected>&gt; $100K</option>
              <option value="medium">$50K – $100K</option>
              <option value="low">&lt; $50K</option>
            </select>
          </div>

          <!-- Purchase Intent -->
          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Purchase Intent</label>
            <select id="sim-intent" onchange="calculateProfit()" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-gold font-sans">
              <option value="high" selected>High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: OUTPUT DISPLAY -->
      <div class="lg:col-span-5 lg:sticky lg:top-24">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-8 sm:p-10 shadow-2xl text-center">
          <div class="text-xs font-mono text-slate-400 mb-3 uppercase tracking-wider">
            PREDICTED NET CAMPAIGN PROFIT
          </div>
          <div id="sim-profit" class="text-5xl sm:text-6xl font-extrabold text-brand-gold font-mono tracking-tight my-4">
            $46,920
          </div>
          <p class="text-xs text-slate-400 font-mono mt-4">
            Estimated net return based on selected campaign parameters.
          </p>
        </div>
      </div>

    </div>
  </main>

  <!-- MINIMAL FOOTER -->
  <footer class="border-t border-brand-border bg-brand-surface/40 py-4 text-xs font-mono text-slate-500 text-center">
    <span>Digital Advertising Campaign Profit Simulator</span>
  </footer>

  <!-- SCRIPT -->
  <script>
    function calculateProfit() {
      const platform = document.getElementById('sim-platform').value;
      const industry = document.getElementById('sim-industry').value;
      const creative = document.getElementById('sim-creative').value;
      const device = document.getElementById('sim-device').value;
      const impressions = parseInt(document.getElementById('sim-impressions').value);
      const duration = parseInt(document.getElementById('sim-duration').value);
      const quality = parseFloat(document.getElementById('sim-quality').value);
      const retargeting = document.getElementById('sim-retargeting').value === 'true';
      const income = document.getElementById('sim-income').value;
      const intent = document.getElementById('sim-intent').value;

      // Update labels
      document.getElementById('val-impressions').textContent = impressions.toLocaleString();
      document.getElementById('val-duration').textContent = duration + ' Days';
      document.getElementById('val-quality').textContent = quality.toFixed(1) + ' / 10';

      // Base
      let profit = 24070;

      // Platform
      const platformWeights = {
        'LinkedIn': 13800,
        'YouTube': 9800,
        'Google Ads': 7200,
        'Instagram': 2400,
        'Pinterest': 1200,
        'TikTok': -1400,
        'Twitter': -2600
      };
      profit += (platformWeights[platform] || 0);

      // Industry
      const industryWeights = {
        'Finance': 19500,
        'Technology': 11800,
        'Healthcare': 7600,
        'E-commerce': 4100,
        'Automotive': 4400,
        'Education': 1500
      };
      profit += (industryWeights[industry] || 0);

      // Creative
      const creativeWeights = {
        'Video': 8900,
        'Carousel': 4500,
        'Static Image': -1100,
        'Text': -4600
      };
      profit += (creativeWeights[creative] || 0);

      // Device
      const deviceWeights = {
        'Desktop': 9600,
        'Mobile': -4900,
        'Tablet': -7200
      };
      profit += (deviceWeights[device] || 0);

      // Impressions
      const impressionEffect = (impressions - 70000) * 0.115;
      profit += impressionEffect;

      // Duration
      const durationEffect = (duration - 30) * 260;
      profit += durationEffect;

      // Quality
      const qualityEffect = (quality - 5.5) * 3400;
      profit += qualityEffect;

      // Retargeting
      if (retargeting) profit += 14800;

      // Income
      if (income === 'high') profit += 11500;
      else if (income === 'low') profit -= 8900;

      // Intent
      if (intent === 'high') profit += 9500;
      else if (intent === 'low') profit -= 6500;

      const finalProfit = Math.round(profit);
      const isPositive = finalProfit >= 0;

      // Update element
      const profitEl = document.getElementById('sim-profit');
      profitEl.textContent = (isPositive ? '$' : '-$') + Math.abs(finalProfit).toLocaleString();
      profitEl.className = 'text-5xl sm:text-6xl font-extrabold font-mono tracking-tight my-4 ' + 
        (finalProfit > 35000 ? 'text-brand-gold' : (finalProfit >= 0 ? 'text-brand-sky' : 'text-brand-rose'));
    }

    function resetDefaults() {
      document.getElementById('sim-platform').value = 'LinkedIn';
      document.getElementById('sim-industry').value = 'Finance';
      document.getElementById('sim-creative').value = 'Video';
      document.getElementById('sim-device').value = 'Desktop';
      document.getElementById('sim-impressions').value = 85000;
      document.getElementById('sim-duration').value = 45;
      document.getElementById('sim-quality').value = 8.5;
      document.getElementById('sim-retargeting').value = 'true';
      document.getElementById('sim-income').value = 'high';
      document.getElementById('sim-intent').value = 'high';
      calculateProfit();
    }

    window.addEventListener('DOMContentLoaded', () => {
      resetDefaults();
    });
  </script>
</body>
</html>
